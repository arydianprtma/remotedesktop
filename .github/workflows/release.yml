name: Release Build & Auto-Update

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Compile Native InputInjector
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:exe /out:"desktop\src\native\InputInjector.exe" /optimize+ "desktop\src\native\InputInjector.cs"

      - name: Install Dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Build and Publish to GitHub Releases
        working-directory: ./desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist
